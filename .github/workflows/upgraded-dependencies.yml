name: Upgraded dependencies

# A canary, not a gate. CI installs the versions in uv.lock, but
# `pip install treeweft` resolves the newest releases that fit the ranges in
# pyproject.toml. This workflow upgrades every dependency within those ranges
# and runs the unit suite, so an upstream release that breaks Treeweft shows
# up here and not in a user's install (tree-sitter-language-pack 1.9.x did).
#
#   * weekly, Monday 03:00 UTC, before Dependabot's Monday run
#   * manual run
#   * pull request that changes this file, so a change to it is tested
#
# It is not a required check and does not run on other pull requests, so it
# never blocks a merge. The upgraded lockfile is not committed. A failed
# scheduled run sends GitHub's failed-workflow email; the run's summary lists
# the installed packages that differ from uv.lock.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/upgraded-dependencies.yml"

concurrency:
  group: upgraded-dependencies-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests, upgraded (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The same two as ci.yml: the supported floor and what the images run.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # The same pin as ci.yml; Dependabot's github-actions updates bump both.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Upgrade the lockfile
        # Rewrites uv.lock in the workspace only. uv reports each change as
        # "Updated <package> v1 -> v2".
        run: |
          set -euo pipefail
          uv lock --upgrade 2>&1 | tee upgrade.log
          grep -E '^(Updated|Added|Removed) ' upgrade.log > changes.log || true
      - name: Install
        # The same extras as ci.yml, from the lockfile just upgraded.
        run: uv sync --locked --extra dev --extra all-backends --extra simple
      - name: Provide the quickstart env
        run: cp .env.example .env
      - name: Read tree-sitter-language-pack version
        id: ts-pack
        run: echo "version=$(uv run --locked --no-sync python -c "import importlib.metadata as m; print(m.version('tree-sitter-language-pack'))")" >> "$GITHUB_OUTPUT"
      - name: Cache tree-sitter parsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: ts-parsers-${{ runner.os }}-${{ steps.ts-pack.outputs.version }}
      - name: Prefetch tree-sitter parsers
        # Parsers download from GitHub on first use; a failure there would
        # otherwise surface as many unrelated test failures. This retries,
        # then fails here naming the languages that did not load. It runs
        # after the quickstart env is in place: the language list is read
        # from the indexer module, which fails loud on unset service vars.
        run: uv run --locked --no-sync python -m treeweft.adapters.tree_sitter.parsers --prefetch
      - name: Unit tests
        run: uv run --locked --no-sync pytest tests/unit -q
      - name: Summarize what was upgraded
        # What names the culprit when a step above fails. The lockfile covers
        # every extra, so its changes are narrowed to the packages this job
        # installed; if the install itself failed, all of them are listed.
        if: always()
        env:
          PYTHON: ${{ matrix.python }}
        run: bash scripts/ci/upgraded_packages_summary.sh >> "$GITHUB_STEP_SUMMARY"
