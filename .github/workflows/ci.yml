name: CI

# `unit-tests` and `ui` are required status checks on main (repository
# ruleset), so they must REPORT on every PR. A trigger-level `paths-ignore`
# would skip the whole workflow on document-only changes and leave the checks
# unreported, which blocks the merge. Instead a cheap `changes` job classifies
# the diff and the jobs are skipped (not absent) when only docs/images
# changed — a skipped required job counts as passing. A skipped job reports
# under its `name:` WITHOUT evaluating matrix expressions, so every required
# job needs a static name (no matrix-derived name).
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN: every job only reads the repository, and
# dorny/paths-filter lists a pull request's changed files through the API.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ui: ${{ steps.ui-filter.outputs.ui == 'true' || steps.ui-filter.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # Anything that is NOT a document or image counts as code. The
          # patterns are all negations, so a file must satisfy EVERY one of
          # them to count (the default quantifier `some` would let a .md
          # file match via `!**/*.svg` and run the suite on docs-only PRs).
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.svg'
              - '!**/*.png'
              - '!**/*.jpg'
              - '!**/*.jpeg'
              - '!**/*.gif'
              - '!**/*.webp'
              - '!**/*.ico'
      # UI code is a file inside ui/ that is also not a doc/image (so a
      # README or the brand SVGs under ui/public/ do not trigger the build),
      # hence `every` again. This workflow file is its own filter because
      # under `every` a file would have to be inside ui/ AND be ci.yml; the
      # `ui` output above ORs the two.
      - id: ui-filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            ui:
              - 'ui/**'
              - '!**/*.md'
              - '!**/*.svg'
              - '!**/*.png'
              - '!**/*.jpg'
              - '!**/*.jpeg'
              - '!**/*.gif'
              - '!**/*.webp'
              - '!**/*.ico'
            workflow:
              - '.github/workflows/ci.yml'

  # Two jobs sharing one step list (YAML anchor) rather than a matrix: the
  # required check is `unit-tests`, and a matrix-derived name is not
  # evaluated when the job is skipped, so a docs-only PR would never report
  # it and could not merge. 3.11 is the supported floor (requires-python);
  # 3.14 is what the Docker images run. The 3.14 job is not required unless
  # the ruleset adds it, and the jobs are independent, so its failure cannot
  # cancel the required one.
  unit-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: unit-tests
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.11"
    steps: &unit-test-steps
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag (`@v10` does not resolve), so
      # pin the release commit; Dependabot's github-actions updates bump it.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install
        # Installs the exact versions in uv.lock, which is what `uv sync`
        # users get. A pip install would resolve the newest releases instead
        # and hide lockfile-only breakage (tree-sitter-language-pack 1.9.1
        # passed CI while failing from the lock). --locked also fails the job
        # if uv.lock is out of date with pyproject.toml.
        # dev alone is test-tooling only; tests/unit also imports every
        # optional-backend package (aiosqlite/chromadb/lancedb/fastembed)
        # via adapter/factory tests, so the
        # full suite needs the all-backends + simple extras too.
        run: uv sync --locked --extra dev --extra all-backends --extra simple
      - name: Provide the quickstart env
        # The indexer fails loud at import when its service vars are unset,
        # and the unit suite imports it (services are mocked, never
        # contacted). src/treeweft/__init__.py loads the repo-root .env, so
        # the quickstart example doubles as the CI config — which also
        # keeps .env.example loadable.
        run: cp .env.example .env
      - name: Unit tests
        run: uv run --locked --no-sync pytest tests/unit -q

  unit-tests-py314:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: unit-tests (python 3.14)
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.14"
    steps: *unit-test-steps

  # The operator UI had no CI: Dependabot npm PRs showed green while failing
  # `npm ci` or the build. Runs only when ui/ code (or this file) changes.
  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same major as the ui/Dockerfile build stage.
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check and build
        # `build` is `tsc -b && vite build`, so this is the type-check too.
        run: npm run build
      - name: Unit tests
        run: npm test
